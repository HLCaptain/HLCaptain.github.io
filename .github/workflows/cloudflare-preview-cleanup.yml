name: Clean Cloudflare PR previews

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete superseded preview deployments
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'hlcaptain-site' }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout trusted cleanup script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Clean up closed PR previews
        run: node scripts/cloudflare-preview-cleanup.mjs
