name: Cloudflare PR Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CLOUDFLARE_PAGES_PROJECT: hlcaptain-site
  SITE_URL: https://hlcaptain.github.io

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build site
        run: npm run build

  cloudflare-config:
    name: Check Cloudflare configuration
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: cloudflare-preview
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      project-name: ${{ steps.check.outputs.project-name }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIGURED_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          set -euo pipefail
          echo "project-name=${CONFIGURED_PROJECT:-$CLOUDFLARE_PAGES_PROJECT}" >> "$GITHUB_OUTPUT"

          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare preview deployment is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare preview deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
            {
              echo "### Cloudflare preview skipped"
              echo
              echo 'Configure `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` in the `cloudflare-preview` environment.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-preview:
    name: Deploy Cloudflare preview
    runs-on: ubuntu-latest
    needs: [validate, cloudflare-config]
    if: needs.cloudflare-config.outputs.configured == 'true'
    environment:
      name: cloudflare-preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy preview branch
        id: deploy
        env:
          PROJECT_NAME: ${{ needs.cloudflare-config.outputs.project-name }}
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$PREVIEW_BRANCH" = "main" ]; then
            PREVIEW_BRANCH=manual-preview
          fi
          deploy_output="$(npm exec --yes --package=wrangler@latest -- wrangler pages deploy dist --project-name="$PROJECT_NAME" --branch="$PREVIEW_BRANCH")"
          printf '%s\n' "$deploy_output"
          deployment_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare preview"
            echo
            echo "$deployment_url"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ui-tests:
    name: Responsive UI tests
    runs-on: ubuntu-latest
    needs: [validate, cloudflare-config, deploy-preview]
    if: always() && needs.validate.result == 'success' && (needs.deploy-preview.result == 'success' || needs.deploy-preview.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Select UI test target
        id: ui-target
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview-url }}
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            echo "base_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
            echo "Running against Cloudflare preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "base_url=" >> "$GITHUB_OUTPUT"
            echo "Running against local Astro preview because Cloudflare deployment is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run responsive UI tests
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.ui-target.outputs.base_url }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
