name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  SITE_URL: https://hlcaptain.github.io
  CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh ProtoShape release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          github_release="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HLCaptain/proto-shape/releases/latest)"
          godot_asset="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            https://godotengine.org/asset-library/api/asset/2237)"

          version="$(jq -er '.tag_name | strings | sub("^v"; "")' <<<"$github_release")"
          asset_version="$(jq -er '.version_string | strings | sub("^v"; "")' <<<"$godot_asset")"
          godot_version="$(jq -er '.godot_version | strings' <<<"$godot_asset")"

          test -n "$version"
          test -n "$godot_version"
          test "$version" = "$asset_version"

          jq -n \
            --arg version "$version" \
            --arg godotVersion "$godot_version" \
            '{ version: $version, godotVersion: $godotVersion }' \
            > src/data/proto-shape-release.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify Web Analytics beacon
        if: env.CF_WEB_ANALYTICS_TOKEN != ''
        run: grep -Fq "data-cf-beacon" dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
