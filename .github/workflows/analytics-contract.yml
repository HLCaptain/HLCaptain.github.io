name: Analytics policy contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analytics-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analytics-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANALYTICS_REQUIRE_META_CSP: "true"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Exercise built CSP in a browser without sending real telemetry
        run: node --test scripts/analytics-contract.mjs
